<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dewi</title>

    <link rel="stylesheet" href="./src/output.css">
    <link
    href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
    rel="stylesheet"
>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <!-- HERO SECTION -->
    <div
        class="h-screen bg-[linear-gradient(#00091099),url('../images/hero-bg.jpg')] bg-cover bg-center">

        <!-- NAVBAR -->
        <!-- CHANGE: items-center keeps all navbar elements vertically aligned -->
        <div
            class="relative flex h-20 items-center justify-between px-6 lg:justify-around"
        >

            <!-- LOGO -->
            <div class="w-20 text-3xl font-bold text-white">
                Dewi
            </div>


            <!-- DESKTOP NAVIGATION -->
            <!-- CHANGE: hidden on small screens and visible on large screens -->
            <div class="hidden w-3xl lg:block">

                <ul
                    class="ml-30 flex w-2xl justify-between text-sm font-sm text-white"
                >

                    <!-- HOME -->
                    <li>
                        <a
                            href="#"
                            class="relative after:absolute after:left-0 after:top-full after:mt-1 after:h-0.5 after:w-full after:bg-[#ff4a17]"
                        >
                            HOME
                        </a>
                    </li>


                    <!-- ABOUT -->
                    <li>
                        <a
                            href="#"
                            class="relative after:absolute after:left-0 after:top-full after:mt-1 after:h-0.5 after:w-0 after:bg-[#ff4a17] after:transition-all after:duration-300 hover:after:w-full"
                        >
                            ABOUT
                        </a>
                    </li>


                    <!-- SERVICES -->
                    <li>
                        <a
                            href="#"
                            class="relative after:absolute after:left-0 after:top-full after:mt-1 after:h-0.5 after:w-0 after:bg-[#ff4a17] after:transition-all after:duration-300 hover:after:w-full"
                        >
                            SERVICES
                        </a>
                    </li>


                    <!-- PORTFOLIO -->
                    <li>
                        <a
                            href="#"
                            class="relative after:absolute after:left-0 after:top-full after:mt-1 after:h-0.5 after:w-0 after:bg-[#ff4a17] after:transition-all after:duration-300 hover:after:w-full"
                        >
                            PORTFOLIO
                        </a>
                    </li>


                    <!-- TEAM -->
                    <li>
                        <a
                            href="#"
                            class="relative after:absolute after:left-0 after:top-full after:mt-1 after:h-0.5 after:w-0 after:bg-[#ff4a17] after:transition-all after:duration-300 hover:after:w-full"
                        >
                            TEAM
                        </a>
                    </li>


                    <!-- DROPDOWN -->
                    <li class="group relative">

                        <!-- DROPDOWN LINK -->
                        <a
                            href="#"
                            class="relative after:absolute after:left-0 after:top-full after:mt-1 after:h-0.5 after:w-0 after:bg-[#ff4a17] after:transition-all after:duration-300 group-hover:after:w-full"
                        >
                            DROPDOWN
                            <i class="fa-solid fa-chevron-down"></i>
                        </a>


                        <!-- DROPDOWN HOVER AREA -->
                        <!-- CHANGE: padding creates a safe hover area between the link and the menu -->
                        <div class="absolute left-0 top-full z-10 hidden pt-3 group-hover:block">

                            <!-- DROPDOWN MENU -->
                            <div
                                class="w-50 rounded bg-white pt-5 pl-5 text-black shadow-lg"
                            >

                                <ul>

                                    <li
                                        class="text-sm/8 font-medium hover:text-orange-500"
                                    >
                                        <a href="#">
                                            DropDown
                                        </a>
                                    </li>

                                    <li
                                        class="text-sm/8 font-medium hover:text-orange-500"
                                    >
                                        <a href="#">
                                            DropDown
                                        </a>
                                    </li>

                                    <li
                                        class="text-sm/8 font-medium hover:text-orange-500"
                                    >
                                        <a href="#">
                                            DropDown
                                        </a>
                                    </li>

                                    <li
                                        class="text-sm/8 font-medium hover:text-orange-500"
                                    >
                                        <a href="#">
                                            DropDown
                                        </a>
                                    </li>

                                    <li
                                        class="text-sm/8 font-medium hover:text-orange-500"
                                    >
                                        <a href="#">
                                            DropDown
                                        </a>
                                    </li>

                                    <li
                                        class="text-sm/8 font-medium hover:text-orange-500"
                                    >
                                        <a href="#">
                                            DropDown
                                        </a>
                                    </li>

                                </ul>

                            </div>

                        </div>

                    </li>


                    <!-- CONTACT -->
                    <li>
                        <a
                            href="#"
                            class="relative after:absolute after:left-0 after:top-full after:mt-1 after:h-0.5 after:w-0 after:bg-[#ff4a17] after:transition-all after:duration-300 hover:after:w-full"
                        >
                            CONTACT
                        </a>
                    </li>

                </ul>

            </div>


            <!-- GET STARTED BUTTON -->
            <!-- CHANGE: centered on small screens and normal on large screens -->
            <div
                class="absolute left-1/2 w-40 -translate-x-1/2 rounded border-2 border-solid border-white p-2 pl-6 font-medium text-white hover:border-none hover:bg-[#ff4a17] lg:static lg:translate-x-0"
            >
                GET STARTED
            </div>


            <!-- MOBILE HAMBURGER BUTTON -->
            <!-- CHANGE: visible on small screens and hidden on large screens -->
            <button
                class="text-2xl text-white lg:hidden"
                type="button"
            >
                <i class="fa-solid fa-bars"></i>
            </button>

        </div>
        <div class=" w-full flex justify-center h-50 text-white  mt-25 " >
         <h1 data-aos="fade-up" data-aos-duration="1000" class="text-3xl font-bold md:text-5xl ">PLAN. LAUNCH. GROW.</h1>
        </div>
        <div data-aos="fade-up" data-aos-duration="1000" class="w-full flex justify-center  h-50 text-gray-200 absolute top-60 ">
         <p data-aos="fade-up"  data-aos-duration="1000" class="max-w-4xl font-medium  md:text-2xl">We are team of talented designers making websites with Bootstrap</p>
        </div>
        <div data-aos="fade-up" data-aos-duration="1000" class="w-full  absolute top-75 flex justify-center gap-3">
         <div data-aos="fade-up" data-aos-duration="1000" class="bg-[#ff4a17] h-10 shrink flex items-center w-32 rounded text-white justify-center px-2 text-sm md:w-40 md:text-base hover:bg-[#f4430ed7] cursor-pointer ">GET STARTED</div>
         <div data-aos="fade-up" data-aos-duration="1000"  class="h-10 flex items-center w-32 shrink px-2 justify-center gap-1 md:w-40 md:gap-2 md:text-base text-sm text-white hover:text-[#ff4a17] cursor-pointer "><i class="fa-regular fa-circle-play text-4xl text-[#ff4a17] md:text-4xl" ></i>  Watch Video</div>
        </div>

    </div>





    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

<script>
    AOS.init();
</script>

</body>

</html>
